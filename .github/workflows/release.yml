name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust kur
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: npm install (root)
        run: npm install

      - name: npm install (ui)
        run: npm install
        working-directory: ui

      - name: Tauri build (portable, no installer)
        run: npx tauri build --no-bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Versiyon oku
        id: ver
        shell: bash
        run: echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Portable exe'yi hazırla
        shell: bash
        run: |
          mkdir -p dist
          cp src-tauri/target/release/netveil.exe \
             "dist/NetVeil-v${{ steps.ver.outputs.version }}-windows-x64.exe"

      - name: Artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: NetVeil-windows-x64
          path: dist/

  release:
    needs: build-windows
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Versiyon oku
        id: ver
        shell: bash
        run: echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Artifact'ı indir
        uses: actions/download-artifact@v4
        with:
          name: NetVeil-windows-x64
          path: dist/

      - name: GitHub Release oluştur
        uses: softprops/action-gh-release@v2
        with:
          name: "NetVeil v${{ steps.ver.outputs.version }}"
          files: dist/NetVeil-v${{ steps.ver.outputs.version }}-windows-x64.exe
          generate_release_notes: true
